<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dicionário — LibrasVision</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="layout">
  <nav class="menu" id="menu"></nav>
  <main class="conteudo">
    <h1>Dicionário</h1>
    <div class="busca">
      <input type="search" id="busca" placeholder="Buscar sinal (ex.: olá, A)">
      <select id="categoria">
        <option value="">Todos</option>
        <option>Alfabeto</option>
        <option>Palavras</option>
        <option>Meus sinais</option>
      </select>
    </div>
    <p class="status" id="contagem"></p>
    <div class="grade" id="grade"></div>
    <button class="botao" id="novo">+ Cadastrar meu sinal</button>

    <dialog id="dialogo" class="largo">
      <h2>Cadastrar meu sinal</h2>
      <label class="campo" style="text-align:left;margin-top:12px">Nome do sinal
        <input type="text" id="nome" maxlength="20" autocomplete="off">
      </label>
      <video id="video" playsinline muted style="display:none"></video>
      <canvas id="tela" class="camera" width="640" height="360"></canvas>
      <p class="status" id="estado"></p>
      <div class="acoes">
        <button class="botao botao--leve" id="cancelar">Cancelar</button>
        <button class="botao" id="gravar" disabled>Gravar</button>
      </div>
    </dialog>
  </main>
</div>
<script src="dados/licoes.js"></script>
<script src="dados/sinais.js"></script>
<script src="js/comum/db.js"></script>
<script src="js/comum/sessao.js"></script>
<script src="js/comum/menu.js"></script>
<script src="js/comum/midia.js"></script>
<script type="module" src="js/dicionario.js"></script>
</body>
</html>
